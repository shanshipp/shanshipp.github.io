<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc"><title id="title">Day 6 · 从 RGB 图像到残差网络</title><desc id="desc">输入处理 → 特征标准化 → 残差学习；理解结构，并区分推导、运行确认和实测指标</desc><rect width="1440" height="850" rx="28" fill="#f8fafc"/><g font-family="Arial,'Microsoft YaHei',sans-serif"><text x="720" y="60" text-anchor="middle" font-size="32" font-weight="700" fill="#0f172a">Day 6 · 从 RGB 图像到残差网络</text><path d="M450 220H525 M915 220H990 M720 330V390 M530 520L370 590 M910 520L1070 590" stroke="#64748b" stroke-width="4" fill="none"/><rect x="60" y="115" width="390" height="215" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="84" y="159" font-size="25" font-weight="700" fill="#1e3a8a">1 · RGB 与数据处理</text><text x="84" y="203" font-size="19" fill="#1e3a8a">[B,3,32,32] → CNN</text><text x="84" y="245" font-size="19" fill="#1e3a8a">训练：裁剪 / 翻转 / 标准化</text><text x="84" y="287" font-size="19" fill="#1e3a8a">评估：确定性预处理</text><rect x="525" y="115" width="390" height="215" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="549" y="159" font-size="25" font-weight="700" fill="#4c1d95">2 · BN 与模型模式</text><text x="549" y="203" font-size="19" fill="#4c1d95">按通道统计，Shape 不变</text><text x="549" y="245" font-size="19" fill="#4c1d95">train / eval 改变模块行为</text><text x="549" y="287" font-size="19" fill="#4c1d95">no_grad 关闭梯度记录</text><rect x="990" y="115" width="390" height="215" rx="22" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="1014" y="159" font-size="25" font-weight="700" fill="#064e3b">3 · 残差与 Shape</text><text x="1014" y="203" font-size="19" fill="#064e3b">H(x)=F(x)+x</text><text x="1014" y="245" font-size="19" fill="#064e3b">主分支 + Identity / Projection</text><text x="1014" y="287" font-size="19" fill="#064e3b">1×1 Conv 对齐通道与尺寸</text><rect x="60" y="590" width="600" height="215" rx="22" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><text x="84" y="634" font-size="25" font-weight="700" fill="#9a3412">4 · 结构与论文</text><text x="84" y="678" font-size="19" fill="#9a3412">Stage → GAP → 分类头</text><text x="84" y="720" font-size="19" fill="#9a3412">更深网络训练误差可能升高</text><text x="84" y="762" font-size="19" fill="#9a3412">残差框架帮助深层优化</text><rect x="780" y="590" width="600" height="215" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="804" y="634" font-size="25" font-weight="700" fill="#92400e">5 · 已确认与待补</text><text x="804" y="678" font-size="19" fill="#92400e">四组实验：本人确认已运行</text><text x="804" y="720" font-size="19" fill="#92400e">具体 Loss / Accuracy 待补</text><text x="804" y="762" font-size="19" fill="#92400e">Flatten 纠错：64×8×8=4096</text><rect x="150" y="390" width="1140" height="130" rx="25" fill="#0f172a"/><text x="720" y="440" text-anchor="middle" font-size="26" font-weight="700" fill="white">输入处理 → 特征标准化 → 残差学习</text><text x="720" y="482" text-anchor="middle" font-size="21" fill="#cbd5e1">理解结构，并区分推导、运行确认和实测指标</text></g></svg>
