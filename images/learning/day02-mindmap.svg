<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Day 2 思维导图</title><desc id="desc">Shape、Broadcasting、Linear 与 Gradient。</desc>
  <rect width="1400" height="760" rx="28" fill="#f8fafc"/><text x="700" y="58" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#0f172a">Day 2 · 从 Tensor Shape 到 Gradient</text>
  <g fill="none" stroke-linecap="round" stroke-width="5"><path d="M610 340 C500 290 430 205 315 175" stroke="#0891b2"/><path d="M610 420 C500 475 430 555 315 585" stroke="#7c3aed"/><path d="M790 340 C900 290 970 205 1085 175" stroke="#16a34a"/><path d="M790 420 C900 475 970 555 1085 585" stroke="#dc2626"/></g>
  <rect x="575" y="300" width="250" height="160" rx="80" fill="#0f172a"/><text x="700" y="360" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="28" font-weight="700" fill="white">Day 2</text><text x="700" y="400" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" fill="#cbd5e1">Shape → Linear → Gradient</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif">
    <rect x="70" y="90" width="420" height="190" rx="22" fill="#cffafe" stroke="#0891b2" stroke-width="3"/><text x="100" y="130" font-size="24" font-weight="700" fill="#164e63">Shape 语义</text><text x="100" y="166" font-size="18" fill="#155e75">• 先解释维度，再操作 Tensor</text><text x="100" y="198" font-size="18" fill="#155e75">• index 常删维 · slice 常保留</text><text x="100" y="230" font-size="18" fill="#155e75">• view / reshape：重新分组</text><text x="100" y="262" font-size="18" fill="#155e75">• permute：改变轴顺序</text>
    <rect x="70" y="490" width="420" height="190" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="100" y="530" font-size="24" font-weight="700" fill="#4c1d95">Broadcasting</text><text x="100" y="566" font-size="18" fill="#5b21b6">• 从最右侧逐维对齐</text><text x="100" y="598" font-size="18" fill="#5b21b6">• 相同或一方为 1 才兼容</text><text x="100" y="630" font-size="18" fill="#5b21b6">• [B,F] + [F] → [B,F]</text><text x="100" y="662" font-size="18" fill="#5b21b6">• bias 自动加到每个样本</text>
    <rect x="910" y="90" width="420" height="190" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="940" y="130" font-size="24" font-weight="700" fill="#14532d">Matrix / Linear</text><text x="940" y="166" font-size="18" fill="#166534">• [B,I] @ [I,O] → [B,O]</text><text x="940" y="198" font-size="18" fill="#166534">• Y = XW + b</text><text x="940" y="230" font-size="18" fill="#166534">• *：逐元素乘法</text><text x="940" y="262" font-size="18" fill="#166534">• @：矩阵乘法</text>
    <rect x="910" y="490" width="420" height="190" rx="22" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="940" y="530" font-size="24" font-weight="700" fill="#7f1d1d">Gradient / Chain Rule</text><text x="940" y="566" font-size="18" fill="#991b1b">• Gradient：Loss 对参数的偏导</text><text x="940" y="598" font-size="18" fill="#991b1b">• 沿负梯度方向更新参数</text><text x="940" y="630" font-size="18" fill="#991b1b">• Chain Rule：逐段传递梯度</text><text x="940" y="662" font-size="18" fill="#991b1b">• Prediction → Loss → Update</text>
  </g>
</svg>
