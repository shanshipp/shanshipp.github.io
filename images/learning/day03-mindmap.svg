<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Day 3 思维导图</title><desc id="desc">Autograd、线性回归、神经网络与分类训练。</desc>
  <rect width="1400" height="760" rx="28" fill="#f8fafc"/><text x="700" y="58" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#0f172a">Day 3 · 训练是如何发生的</text>
  <g fill="none" stroke-linecap="round" stroke-width="5"><path d="M610 340 C500 290 430 205 315 175" stroke="#2563eb"/><path d="M610 420 C500 475 430 555 315 585" stroke="#7c3aed"/><path d="M790 340 C900 290 970 205 1085 175" stroke="#059669"/><path d="M790 420 C900 475 970 555 1085 585" stroke="#ea580c"/></g>
  <rect x="575" y="300" width="250" height="160" rx="80" fill="#0f172a"/><text x="700" y="360" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="28" font-weight="700" fill="white">Day 3</text><text x="700" y="400" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" fill="#cbd5e1">Loss ↓ · Parameter Update</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif">
    <rect x="70" y="90" width="420" height="190" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="100" y="130" font-size="24" font-weight="700" fill="#1e3a8a">Autograd</text><text x="100" y="166" font-size="18" fill="#1e40af">• 计算图记录 Tensor 与运算依赖</text><text x="100" y="198" font-size="18" fill="#1e40af">• backward 沿图应用 Chain Rule</text><text x="100" y="230" font-size="18" fill="#1e40af">• .grad 默认累积 · zero_grad 清空</text><text x="100" y="262" font-size="18" fill="#1e40af">• no_grad / detach 控制追踪</text>
    <rect x="70" y="490" width="420" height="190" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="100" y="530" font-size="24" font-weight="700" fill="#4c1d95">Linear Regression</text><text x="100" y="566" font-size="18" fill="#5b21b6">• prediction = wx + b · MSE Loss</text><text x="100" y="598" font-size="18" fill="#5b21b6">• Manual Gradient = Autograd Gradient</text><text x="100" y="630" font-size="18" fill="#5b21b6">• Learning Rate 控制更新步长</text><text x="100" y="662" font-size="18" fill="#5b21b6">• SGD：zero_grad → backward → step</text>
    <rect x="910" y="90" width="420" height="190" rx="22" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="940" y="130" font-size="24" font-weight="700" fill="#064e3b">Neural Network</text><text x="940" y="166" font-size="18" fill="#065f46">• nn.Module：层与数据流</text><text x="940" y="198" font-size="18" fill="#065f46">• Linear：X @ weight.T + bias</text><text x="940" y="230" font-size="18" fill="#065f46">• ReLU：引入非线性</text><text x="940" y="262" font-size="18" fill="#065f46">• MLP：784 → 256 → 128 → 10</text>
    <rect x="910" y="490" width="420" height="190" rx="22" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><text x="940" y="530" font-size="24" font-weight="700" fill="#7c2d12">Classification Loop</text><text x="940" y="566" font-size="18" fill="#9a3412">• logits：[Batch, Classes]</text><text x="940" y="598" font-size="18" fill="#9a3412">• labels：[Batch]</text><text x="940" y="630" font-size="18" fill="#9a3412">• CrossEntropyLoss · argmax</text><text x="940" y="662" font-size="18" fill="#9a3412">• forward → loss → backward → step</text>
  </g>
</svg>
