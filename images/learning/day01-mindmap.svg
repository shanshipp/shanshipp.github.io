  <title id="title">Day 1 思维导图</title><desc id="desc">环境、机器学习基础、Tensor 与 HPC。</desc>
  <rect width="1400" height="760" rx="28" fill="#f8fafc"/><text x="700" y="58" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#0f172a">Day 1 · 从环境到深度学习基础</text>
  <g fill="none" stroke-linecap="round" stroke-width="5"><path d="M610 340 C500 290 430 205 315 175" stroke="#2563eb"/><path d="M610 420 C500 475 430 555 315 585" stroke="#7c3aed"/><path d="M790 340 C900 290 970 205 1085 175" stroke="#059669"/><path d="M790 420 C900 475 970 555 1085 585" stroke="#ea580c"/></g>
  <rect x="575" y="300" width="250" height="160" rx="80" fill="#0f172a"/><text x="700" y="360" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="28" font-weight="700" fill="white">Day 1</text><text x="700" y="400" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" fill="#cbd5e1">基础设施 × 基础认知</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif">
    <rect x="70" y="90" width="420" height="190" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="100" y="130" font-size="24" font-weight="700" fill="#1e3a8a">环境与工具</text><text x="100" y="166" font-size="18" fill="#1e40af">• WSL2 + Ubuntu + NVIDIA Driver</text><text x="100" y="198" font-size="18" fill="#1e40af">• PyTorch CUDA Runtime → GPU</text><text x="100" y="230" font-size="18" fill="#1e40af">• Conda dl 环境 · VS Code WSL</text><text x="100" y="262" font-size="18" fill="#1e40af">• nvidia-smi / torch.cuda 验证</text>
    <rect x="70" y="490" width="420" height="190" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="100" y="530" font-size="24" font-weight="700" fill="#4c1d95">Tensor 核心</text><text x="100" y="566" font-size="18" fill="#5b21b6">• shape · dtype · device</text><text x="100" y="598" font-size="18" fill="#5b21b6">• 图像 Shape：[B,C,H,W]</text><text x="100" y="630" font-size="18" fill="#5b21b6">• reshape / view / permute</text><text x="100" y="662" font-size="18" fill="#5b21b6">• cat 不增维 · stack 增维</text>
    <rect x="910" y="90" width="420" height="190" rx="22" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="940" y="130" font-size="24" font-weight="700" fill="#064e3b">机器学习基础</text><text x="940" y="166" font-size="18" fill="#065f46">• AI → ML → DL</text><text x="940" y="198" font-size="18" fill="#065f46">• x → model → prediction → loss</text><text x="940" y="230" font-size="18" fill="#065f46">• gradient → 更新 parameter</text><text x="940" y="262" font-size="18" fill="#065f46">• Train 学 · Validation 选 · Test 评</text>
    <rect x="910" y="490" width="420" height="190" rx="22" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><text x="940" y="530" font-size="24" font-weight="700" fill="#7c2d12">HPC 工作流</text><text x="940" y="566" font-size="18" fill="#9a3412">• Login Node：登录与提交任务</text><text x="940" y="598" font-size="18" fill="#9a3412">• Slurm：调度 CPU / GPU 资源</text><text x="940" y="630" font-size="18" fill="#9a3412">• Compute Node：执行计算任务</text><text x="940" y="662" font-size="18" fill="#9a3412">• tmux：保持终端会话</text>
  </g>
